name: Upload Python Package

on:
  release:
    types: [created]

jobs:
  deploy:
    permissions:
      contents: write  # Required to update release notes
      id-token: write  # Required for PyPI trusted publishing
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Needed for setuptools_scm to determine the version

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install build
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build python package
        run: |
          python -m build

      # No credentials: the package is published through a PyPI trusted
      # publisher, which authenticates this workflow with the OIDC token
      # granted by `id-token: write` above
      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
